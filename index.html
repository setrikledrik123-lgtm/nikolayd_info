<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NikolayD — Профиль</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
            color: #fff;
            background:
                radial-gradient(circle at 20% 20%, rgba(88, 101, 242, 0.22), transparent 35%),
                radial-gradient(circle at 80% 80%, rgba(114, 137, 218, 0.14), transparent 35%),
                #0b0d12;
        }

        .profile {
            width: 100%;
            max-width: 430px;
            padding: 34px 28px 30px;
            text-align: center;
            background: rgba(20, 23, 31, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
        }

        .avatar-wrap {
            width: 150px;
            height: 150px;
            margin: 0 auto 20px;
            padding: 5px;
            border-radius: 50%;
            background: linear-gradient(135deg, #5865f2, #8b5cf6);
            box-shadow: 0 0 35px rgba(88, 101, 242, 0.35);
            overflow: hidden;
        }

        .avatar {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #14171f;
            transition: transform 0.3s ease;
        }

        .avatar-wrap:hover .avatar {
            transform: scale(1.05);
        }

        .name {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: 0.2px;
            margin-bottom: 8px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #aeb4c2;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #23d366;
            box-shadow: 0 0 10px rgba(35, 211, 102, 0.65);
        }

        .discord-button {
            width: 100%;
            border: 0;
            border-radius: 14px;
            padding: 15px 18px;
            background: #5865f2;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
            box-shadow: 0 10px 25px rgba(88, 101, 242, 0.28);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .discord-button svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .discord-button:hover {
            transform: translateY(-2px);
            background: #6975f5;
            box-shadow: 0 14px 30px rgba(88, 101, 242, 0.38);
        }

        .discord-button:active {
            transform: translateY(0);
        }

        .hint {
            margin-top: 16px;
            color: #777f91;
            font-size: 12px;
            line-height: 1.5;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 28px;
            transform: translate(-50%, 20px);
            width: min(90%, 430px);
            padding: 15px 18px;
            border-radius: 14px;
            background: #181c25;
            border: 1px solid rgba(35, 211, 102, 0.3);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.45);
            color: #fff;
            font-size: 14px;
            line-height: 1.45;
            opacity: 0;
            pointer-events: none;
            transition: 0.25s ease;
            z-index: 10;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .toast strong {
            color: #23d366;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>

<body>
    <main class="profile">
        <div class="avatar-wrap">
            <img class="avatar" src="avatar.png" alt="Аватар NikolayD">
        </div>

        <h1 class="name">NikolayD</h1>

        <div class="status">
            <span class="dot"></span>
            Онлайн
        </div>

        <button class="discord-button" id="discordButton">
            <!-- Официальное SVG лого Discord -->
            <svg viewBox="0 0 127.14 96.36">
                <path d="M107.7,8.07A105.15,105.15,0,0,0,77.26,0a77.19,77.19,0,0,0-3.3,6.83A96.67,96.67,0,0,0,53.22,6.83,77.19,77.19,0,0,0,49.88,0,105.15,105.15,0,0,0,19.44,8.07C3.66,31.58-1.86,54.65,1,77.53A105.73,105.73,0,0,0,32,96.36a74.37,74.37,0,0,0,6.72-10.93,68.6,68.6,0,0,1-10.64-5.12c.91-.67,1.81-1.37,2.65-2.1a75.22,75.22,0,0,0,72.78,0c.84.73,1.74,1.43,2.65,2.1a68.86,68.86,0,0,1-10.64,5.12,74.74,74.74,0,0,0,6.72,10.93,105.73,105.73,0,0,0,31-18.83C129.72,49.52,123.82,26.69,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53S36.18,40.36,42.45,40.36,53.88,46,53.79,53,48.72,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.24,60,73.24,53S78.41,40.36,84.69,40.36,96.12,46,96,53,91,65.69,84.69,65.69Z"/>
            </svg>
            Связаться в Discord
        </button>

        <p class="hint">
            Нажмите кнопку, чтобы скопировать имя пользователя Discord.
        </p>
    </main>

    <div class="toast" id="toast">
        <strong>✓ Успешно скопировано!</strong><br>
        Вставьте <b>niko_1352647832</b> во вкладку «Добавить в друзья» и ожидайте запроса.
    </div>

    <script>
        const discordUsername = "niko_1352647832";
        const button = document.getElementById("discordButton");
        const toast = document.getElementById("toast");
        let toastTimeout = null; // Переменная для хранения таймера

        function showToast() {
            // Если уведомление уже показывается, сбрасываем старый таймер
            if (toastTimeout) {
                clearTimeout(toastTimeout);
            }

            toast.classList.add("show");

            // Запускаем новый таймер скрытия
            toastTimeout = setTimeout(() => {
                toast.classList.remove("show");
                toastTimeout = null;
            }, 4500);
        }

        button.addEventListener("click", async () => {
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(discordUsername);
                    showToast();
                } else {
                    throw new Error("Clipboard API не поддерживается");
                }
            } catch (error) {
                const textarea = document.createElement("textarea");
                textarea.value = discordUsername;
                textarea.style.position = "fixed"; // Чтобы не дергался экран на мобилках
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand("copy");
                textarea.remove();
                showToast();
            }
        });
    </script>
</body>
</html>
